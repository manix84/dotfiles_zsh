name: Bug report
description: Report a reproducible problem with the installer or configuration
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials or private information.
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Include the name and version.
      placeholder: ReadyNAS OS 6.x, Ubuntu 24.04, or macOS 15
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: x86_64, aarch64, or armv7l
    validations:
      required: true
  - type: input
    id: shell-package-manager
    attributes:
      label: Shell and package manager
      placeholder: Bash with apt
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact command after removing sensitive values.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Remove credentials, hostnames, IP addresses, usernames, and private paths.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private information and credentials.
          required: true

